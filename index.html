<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>115-1 考試與約會時程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#18202B; --muted:#5F6B7A; --line:#D9DEE5; --faint:#E9EDF1;
  --med:#8C2F39; --dent:#1D6A78; --today:#D2462B;
  --med-soft:#F6E7E8; --dent-soft:#E2F0F2; --date:#B5651D; --date-soft:#FBEBDD;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161C; --surface:#1A2029; --ink:#E8ECF1; --muted:#9AA5B3; --line:#2E3744; --faint:#232B36;
    --med:#E3848C; --dent:#5FC0CF; --today:#FF7A5C; --med-soft:#33232A; --dent-soft:#1B3238; --date:#F0A868; --date-soft:#3A2A1E;
  }
}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1A2029; --ink:#E8ECF1; --muted:#9AA5B3; --line:#2E3744; --faint:#232B36;
  --med:#E3848C; --dent:#5FC0CF; --today:#FF7A5C; --med-soft:#33232A; --dent-soft:#1B3238; --date:#F0A868; --date-soft:#3A2A1E;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:40px 20px 64px}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(26px,4.6vw,38px);line-height:1.2;margin:0 0 6px;letter-spacing:.02em}
.lede{color:var(--muted);margin:0 0 24px;font-size:15px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* view switch */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);margin-bottom:28px}
.seg button{border:0;background:transparent;padding:7px 16px;cursor:pointer;font-size:15px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:700}

/* next */
.nexts{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:20px;margin-bottom:36px}
.next{display:grid;grid-template-columns:1fr auto;gap:4px 18px;align-items:end;border-left:6px solid var(--c);padding:2px 0 2px 16px}
.next .k{font-size:14px;color:var(--c);margin:0;font-weight:700}
.next .t{font-family:var(--serif);font-weight:900;font-size:clamp(19px,2.6vw,25px);line-height:1.3;margin:2px 0 4px}
.next .w{margin:0;color:var(--muted);font-size:14px}
.next .days{font-family:var(--serif);font-weight:900;font-size:clamp(54px,8vw,84px);line-height:.85;color:var(--c);text-align:right;font-variant-numeric:tabular-nums}
.next .days small{display:block;font-family:var(--sans);font-weight:500;font-size:13px;color:var(--muted);margin-top:8px}

/* ruler */
.ruler{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px 14px;margin-bottom:28px}
.ruler h2{font-size:15px;font-weight:700;margin:0 0 10px}
.rgrid{display:grid;grid-template-columns:30px 1fr;row-gap:0}
.lanelab{font-size:13px;font-weight:700;display:flex;align-items:center}
.lane{position:relative;height:46px;border-bottom:1px dashed var(--faint)}
.lane:last-of-type{border-bottom:0}
.weeks{display:grid;grid-template-columns:repeat(16,1fr);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.weeks div{padding-left:3px;border-left:1px solid var(--faint)}
.track{position:relative;grid-column:2}
.track::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/16 - 1px),var(--faint) calc(100%/16 - 1px) calc(100%/16));pointer-events:none}
.pin{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--c);transform:translate(-50%,0);border:2px solid var(--surface);cursor:pointer;padding:0}
.pin.past{opacity:.3}
.nowline{position:absolute;top:-6px;bottom:0;width:2px;background:var(--today);transform:translateX(-1px);pointer-events:none;z-index:1}
.nowline span{position:absolute;top:-4px;left:5px;font-size:11px;color:var(--today);font-weight:700;white-space:nowrap}
.clash{font-size:13px;color:var(--muted);margin:10px 0 0}

/* filters */
.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.frow b{font-size:13px;color:var(--c);width:52px;flex:none}
.chip{font-size:13px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--soft);border-color:transparent}
.chip[aria-pressed="false"]{color:var(--muted);text-decoration:line-through;opacity:.6}
.toggle{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin-top:4px}

/* list */
.cols{position:sticky;top:0;z-index:2;background:var(--bg);display:grid;grid-template-columns:var(--gc);gap:0 16px;padding:10px 0 6px;border-bottom:2px solid var(--ink);margin-top:16px}
.cols div{font-weight:700;font-size:15px}
.cols .cm{color:var(--med)} .cols .cd2{color:var(--dent)}
.month{font-family:var(--serif);font-weight:600;font-size:20px;margin:26px 0 4px}
.day{display:grid;grid-template-columns:var(--gc);grid-auto-flow:row dense;gap:0 16px;padding:12px 0;border-bottom:1px solid var(--faint)}
.day.both{background:linear-gradient(90deg,transparent 0 64px,color-mix(in srgb,var(--faint) 55%,transparent) 64px)}
.date{text-align:center;padding-top:2px;grid-row:1 / span 2;grid-column:1}
.dn{font-family:var(--serif);font-weight:900;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.dw{font-size:12px;color:var(--muted)}
.cell{display:flex;flex-direction:column;gap:10px;min-width:0}
.ex{border-left:3px solid var(--c);padding:0 0 0 12px;position:relative}
.ex h3{margin:0;font-size:16px;font-weight:700;line-height:1.4}
.ex h3 .sub{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.meta{font-size:13.5px;color:var(--muted);margin:1px 0 0}
.meta .cnt{color:var(--c);font-weight:700}
.scope{font-size:14px;margin:4px 0 0}
details{margin-top:4px;font-size:13.5px}
summary{cursor:pointer;color:var(--c);font-weight:500;width:max-content;max-width:100%}
details ul{margin:4px 0 0;padding-left:18px}
details li{margin-bottom:1px}
.badge{display:none;font-size:11px;font-weight:700;color:var(--surface);background:var(--c);border-radius:3px;padding:0 5px;margin-right:6px;vertical-align:2px}
.ex.past{color:var(--muted)} .ex.past .cnt{color:var(--muted);font-weight:400}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--c) 18%,transparent)}to{background:transparent}}
.empty{color:var(--muted);font-size:14px;margin:20px 0}
/* outings */
.pin.heart{border-radius:2px;transform:translate(-50%,0) rotate(45deg);width:11px;height:11px}
.pin.span{border-radius:6px;transform:none;height:10px;min-width:14px}
.out{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;background:var(--date-soft);border-left:3px solid var(--date);border-radius:0 6px 6px 0;padding:7px 12px;margin:0 0 10px}
.cell+.out{margin:10px 0 0}
.out h3{margin:0;font-size:16px;font-weight:700;color:var(--date)}
.out .when{font-size:13.5px;color:var(--ink)}
.out .gap{font-size:13px;color:var(--muted);flex-basis:100%}
.out.past{opacity:.55}
.outchip{--c:var(--date);--soft:var(--date-soft)}
footer{margin-top:36px;font-size:13px;color:var(--muted);max-width:72ch}

@media (max-width:720px){
  .wrap{padding:28px 14px 48px}
  .nexts{grid-template-columns:1fr}
  .cols{display:none}
  .day{grid-template-columns:48px 1fr !important}
  .day.both{background:none}
  .out{grid-column:2}
  .cell.c-dent:not(:empty){margin-top:10px}
  .cell{grid-column:2}
  .date{grid-row:1 / span 2}
  .badge{display:inline-block}
  .weeks div{font-size:9px;padding-left:1px}
}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
</style>
</head>

<main class="wrap">
  <h1>115-1 考試時程</h1>
  <p class="lede">醫學系與牙醫系並排，加上一起出去的日子 · 9 月 7 日至 12 月 25 日</p>

    <p class="clash" id="clash"></p>

function renderRuler(){

  }
}

  const xs=EXAMS.filter(x=>visible(x)&&(showPast||!x.past));
  const os=showOut?OUTINGS.filter(o=>showPast||!o.past):[];
  const days=[...new Set([...xs.map(x=>x.d),...os.map(o=>o.d)])].sort();
  let h=`<div class="cols"><div></div>${ps.map(p=>`<div class="${p==='med'?'cm':'cd2'}">${PROG[p].label}</div>`).join('')}</div>`, month=-1;
  days.forEach(d=>{
    const dt=parse(d);
    if(dt.getMonth()!==month){month=dt.getMonth();h+=`<h2 class="month">${month+1} 月</h2>`}
    const cells=ps.map(p=>xs.filter(x=>x.d===d&&x.prog===p));
    h+=`<div class="day${cells.every(c=>c.length)&&ps.length===2?' both':''}">
      <div class="date"><div class="dn">${dt.getDate()}</div><div class="dw">週${WD[dt.getDay()]}</div></div>
      ${os.filter(o=>o.d===d&&!o.when.includes('晚')).map(outCard).join('')}
      ${cells.map((c,i)=>`<div class="cell c-${ps[i]}">${c.map(card).join('')}</div>`).join('')}
      ${os.filter(o=>o.d===d&&o.when.includes('晚')).map(outCard).join('')}</div>`;
  });
  list.innerHTML=days.length?h:'<p class="empty">目前的篩選下沒有考試。點上方的科目重新加入，或勾選「顯示已結束的考試」。</p>';
}

function jump(x){
  if(x.past&&!showPast){showPast=true;store.set('showPast','1');document.getElementById('pastT').checked=true;renderList()}
  const r=document.getElementById(x.id); if(!r) return;
  r.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});
  r.classList.remove('flash'); void r.offsetWidth; r.classList.add('flash');
}
function renderAll(){renderSeg();renderNext();renderRuler();renderFilters();renderList()}
renderAll();
</script>
